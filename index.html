<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PutiMach — Premium Vintage Fashion & Heritage Craft. Handcrafted clothing designed to transcend seasons." />
    <meta name="keywords" content="vintage fashion, heritage craft, sarees, panjabi, traditional clothing, putimach, bangladesh" />
    <meta property="og:title" content="PutiMach — Premium Vintage Fashion" />
    <meta property="og:description" content="Timeless Heritage. Nostalgic Luxury." />
    <meta name="theme-color" content="#C5A880" />
    <title>PutiMach | Premium Vintage Fashion & Heritage Craft</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          var errDiv = document.createElement('div');
          errDiv.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#1C1613;color:#FDFBF7;font-family:sans-serif;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;';
          errDiv.innerHTML = '<h2 style="color:#C5A880;margin-bottom:12px;">PutiMach Deployment Diagnostic Alert</h2><p style="color:#A5978E;max-width:600px;margin-bottom:20px;">A runtime initialization error occurred. Details below:</p><pre style="background:#241E1A;color:#E9E2D2;padding:16px;border-radius:8px;font-size:13px;max-width:90%;overflow-x:auto;text-align:left;">' + (e.message || e.error || 'Unknown script error') + '\nFile: ' + (e.filename || 'bundle') + ':' + (e.lineno || '0') + '</pre><button onclick="location.reload()" style="margin-top:20px;padding:10px 24px;background:#C5A880;color:#1C1613;border:none;border-radius:99px;font-weight:bold;cursor:pointer;">Reload Page</button>';
          document.body.appendChild(errDiv);
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
